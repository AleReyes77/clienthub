name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: clienthub
          POSTGRES_PASSWORD: clienthub
          POSTGRES_DB: clienthub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clienthub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://clienthub:clienthub@localhost:5432/clienthub_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and format check
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Apply database migrations
        run: npm run db:deploy -w @clienthub/api
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Unit and integration tests
        run: npm test

      - name: Build
        run: npm run build
