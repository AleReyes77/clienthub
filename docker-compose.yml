# Local infrastructure for development.
# Start with: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: clienthub
      POSTGRES_PASSWORD: clienthub
      POSTGRES_DB: clienthub
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clienthub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
